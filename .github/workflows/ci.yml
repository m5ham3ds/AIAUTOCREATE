name: 🤖 AI AutoCreate CI/CD

# ============================================================
# 🧠 التشغيل التلقائي
# ============================================================
on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:  # 🖐️ تشغيل يدوي من واجهة GitHub

# ============================================================
# ⚙️ المتغيرات العامة
# ============================================================
env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=512m'"

# ============================================================
# 📦 المهام (Jobs)
# ============================================================
jobs:

  # ── 1️⃣ فحص جودة الكود الثابت ────────────────────────
  lint:
    name: 🔍 Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🕵️ Run Detekt Analysis
        run: ./gradlew detekt --stacktrace
        continue-on-error: true

      - name: 📊 Upload Detekt Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/

  # ── 2️⃣ الاختبارات وبناء التطبيق ──────────────────────
  build:
    name: 🧪 Test & Build APK
    runs-on: ubuntu-latest
    needs: lint  # ⛓️ ينتظر انتهاء فحص الجودة
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: 📊 Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 📱 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 🎯 AI-AutoCreate-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: ✅ Build Summary
        if: success()
        run: |
          echo "🎉 Build Successful!"
          echo "📅 Date: $(date)"
          echo "🔗 Commit: ${{ github.sha }}"
